<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>F1 SSTV Generator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#111;--card:#f3f3f3;--bd:#ccc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--card:#1c1c1c;--bd:#444}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--card:#1c1c1c;--bd:#444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:1fr 1fr}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 12px}fieldset{border:1px solid var(--bd);background:var(--card);border-radius:8px;margin:0 0 12px;padding:10px 12px}
legend{font-size:12px;opacity:.7;padding:0 4px}label{display:block;font-size:12px;opacity:.8;margin:6px 0 2px}
input{width:100%;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;text-transform:uppercase}
.r{display:flex;gap:8px}.r>div{flex:1}.r .s{flex:.5}
button{padding:9px 14px;border:0;border-radius:6px;background:#e10600;color:#fff;font:inherit;cursor:pointer;margin-right:6px}
canvas{width:100%;max-width:100%;height:auto;image-rendering:pixelated;border:1px solid var(--bd);background:#000}
.pw{position:relative}.pw span{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.7;pointer-events:none}.pw input{padding-left:20px}
select{width:100%;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;text-transform:uppercase}
.ck{display:flex!important;gap:6px;align-items:center;opacity:1!important;margin-top:6px}.ck input{width:auto}
.st{position:relative}.st input{padding-right:28px}.st .b{position:absolute;right:1px;top:1px;bottom:1px;width:24px;display:flex;flex-direction:column;gap:1px}.st .b button{flex:1;margin:0;padding:0;font-size:9px;line-height:1;background:#555;border-radius:3px}

textarea{width:100%;padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;text-transform:uppercase;resize:vertical;height:64px}
.dr{display:grid;grid-auto-flow:column;grid-template-rows:repeat(11,auto);gap:5px 10px}
#gridApp .pw span{left:8px;opacity:.6;font-size:12px}#gridApp .pw input{padding:5px 6px 5px 34px}
.pv{position:sticky;top:16px;align-self:start}@media(max-width:760px){.pv{position:static!important}}
.off{display:none!important}
.tabs{display:flex;gap:6px;max-width:1000px;margin:0 auto;padding:14px 16px 0}
.tabs button{background:var(--card);color:var(--fg);border:1px solid var(--bd);margin:0}.tabs button.on{background:#e10600;color:#fff;border-color:#e10600}
.modebar{max-width:1000px;margin:0 auto;padding:14px 16px 0}.modebar label{display:flex;align-items:center;gap:8px;font-size:13px;opacity:1;margin:0}.modebar select{width:auto;text-transform:none}
</style></head><body><div class="modebar"><label>Mode <select id="mode"><option value="pd">PD120 · 640×496</option><option value="bw">B/W 8 / B/W 12 · 160×120</option></select></label></div><nav class="tabs" id="tabs"><button class="on" data-t="lapApp">Lap card</button><button data-t="gridApp">Starting grid</button></nav><div class="wrap" id="lapApp"><div>
